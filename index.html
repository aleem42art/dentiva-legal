<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dentiva Legal</title>
<meta name="description" content="Legal information for Dentiva, the dental clinic management app by Cavitex.">
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg:#f6f8f8; --surface:#fff; --text:#1b2426; --muted:#5a6769; --border:#dfe5e6; --accent:#0d7068; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1415; --surface:#151c1e; --text:#e4ebeb; --muted:#9aa8aa; --border:#273133; --accent:#5cc9bb; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; padding:24px 16px; }
  main { width:100%; max-width:520px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 28px; }
  h1 { margin:0 0 6px; font-size:26px; letter-spacing:-.01em; }
  p { margin:0 0 20px; color:var(--muted); }
  a.row { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border:1px solid var(--border);
          border-radius:12px; color:var(--text); text-decoration:none; font-weight:600; }
  a.row:hover { border-color:var(--accent); color:var(--accent); }
  .small { margin:20px 0 0; font-size:14px; }
  .small a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Dentiva</h1>
  <p>Dental clinic management app by Cavitex.</p>
  <a class="row" href="privacy-policy/">Privacy Policy <span aria-hidden="true">→</span></a>
  <a class="row" href="terms/" style="margin-top:10px">Terms of Service <span aria-hidden="true">→</span></a>
  <p class="small">Questions: <a href="mailto:cavitexdental@gmail.com?subject=Dentiva">cavitexdental@gmail.com</a></p>
</main>
</body>
</html>
